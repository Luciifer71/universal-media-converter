[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-media-converter"
version = "0.1.0"
description = "A Windows-first media conversion toolkit built with Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - license pending" }
authors = [
    { name = "Luciifer71" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9"
]

[project.scripts]
umc = "umc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"