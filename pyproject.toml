[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-media-converter"
dynamic = ["version"]
description = "A simple command-line media converter for video, audio and images, powered by FFmpeg."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Krishay Shah" }
]
keywords = ["ffmpeg", "converter", "video", "audio", "image", "cli", "media"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Luciifer71/universal-media-converter"
Documentation = "https://github.com/Luciifer71/universal-media-converter#readme"
Issues = "https://github.com/Luciifer71/universal-media-converter/issues"
Changelog = "https://github.com/Luciifer71/universal-media-converter/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "build>=1.2",
    "twine>=6.1",
]

[project.scripts]
umc = "umc.cli:main"

[tool.setuptools.dynamic]
version = { attr = "umc.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# If a test hangs for 2 minutes, print where it is stuck.
faulthandler_timeout = 120

[tool.ruff]
line-length = 100
target-version = "py310"