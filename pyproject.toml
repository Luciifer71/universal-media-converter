[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-media-converter"
version = "0.1.0"
description = "A simple command-line media converter for video, audio and images, powered by FFmpeg."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary - license pending" }
authors = [
    { name = "Luciifer71" }
]
keywords = ["ffmpeg", "converter", "video", "audio", "image", "cli", "media"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Luciifer71/universal-media-converter"
Issues = "https://github.com/Luciifer71/universal-media-converter/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.9"
]

[project.scripts]
umc = "umc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"