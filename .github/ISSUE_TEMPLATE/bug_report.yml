name: Bug report
description: Report a conversion that failed or produced the wrong result
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not attach private videos, photos or recordings. A short test file or the `umc info` output is usually enough."
  - type: textarea
    id: command
    attributes:
      label: Command, expected result and actual result
      description: Paste the exact `umc` command and its full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input file details
      description: Paste the output of `umc info YOUR_FILE`.
      render: text
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, `umc --version`, `python --version` and the first line of `ffmpeg -version`.
    validations:
      required: true
