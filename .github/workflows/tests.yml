name: Tests

on:
  # Pull requests are tested once; pushes to other branches are covered by their PR.
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push cancels the older, now-outdated run of the same branch.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    # Normally finishes in 1-2 minutes; never let a stuck job run for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Every OS on the newest Python, plus the oldest supported Python on Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          python -m ruff format --check src tests
          python -m ruff check src tests

      - name: Test (including real FFmpeg conversions)
        # -v prints each test name as it runs, so a slow or stuck test is easy to spot.
        run: python -m pytest -v -rs --durations=5

  package:
    name: Build package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and check
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the built wheel and run it
        run: |
          python -m pip install dist/*.whl
          umc --version
          umc formats
